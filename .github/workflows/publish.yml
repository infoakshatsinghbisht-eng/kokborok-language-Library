name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kokborok
    permissions:
      id-token: write      # Mandatory for PyPI Trusted Publishing (OIDC) & Sigstore Provenance
      contents: write     # For repository releases and tags
      attestations: write # For GitHub Artifact Attestations

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build binary wheel and source tarball
      run: python -m build

    - name: Verify build distributions
      run: |
        ls -la dist/
        python -m twine check dist/*

    - name: Generate build provenance attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: 'dist/*'

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
